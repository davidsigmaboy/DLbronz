name: Build DLbronz IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchains
        run: |
          swift --version
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/dlbronz_web/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/dlbronz_web/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust core tests (no dependencies)
        run: ./scripts/test-core.sh

      - name: Build Rust xcframework (iOS, iOS simulator, macOS)
        run: ./scripts/build-rust-xcframework.sh

      - name: Engine tests (macOS)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project DLbronz.xcodeproj \
            -scheme DLbronz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/DLbronz.app"
          test -d "$APP"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/DLbronz.ipa Payload
          ls -la dist

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-ipa
          path: dist/DLbronz.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLbronz.ipa

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/dlbronz_linux/target
          key: cargo-linux-${{ hashFiles('rust/dlbronz_linux/Cargo.toml', 'rust/dlbronz_web/Cargo.toml') }}
          restore-keys: cargo-linux-

      - name: JS DOM copy is in sync with the Swift one
        run: python3 scripts/extract-dom-js.py --check

      - name: Rust core tests (no dependencies)
        run: ./scripts/test-core.sh

      - name: Linux tests
        run: cargo test --release --manifest-path rust/dlbronz_linux/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path rust/dlbronz_linux/Cargo.toml

      - name: Headless render of the sample page
        run: |
          mkdir -p dist
          ./rust/dlbronz_linux/target/release/dlbronz-linux samples/test.html --png dist/sample.png --width 800
          test "$(stat -c%s dist/sample.png)" -gt 5000
          file dist/sample.png

      - name: Publish sample screenshot to the screenshots branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp dist/sample.png "$RUNNER_TEMP/sample.png"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf . -q
          cp "$RUNNER_TEMP/sample.png" sample.png
          git add sample.png
          git commit -q -m "Sample screenshot from ${GITHUB_SHA}"
          git push -f origin screenshots
          git checkout -q "${GITHUB_SHA}"

      - name: Package
        run: |
          mkdir -p pkg/dlbronz-linux
          cp rust/dlbronz_linux/target/release/dlbronz-linux pkg/dlbronz-linux/
          cp README.md LICENSE pkg/dlbronz-linux/
          cp -r samples pkg/dlbronz-linux/
          tar -C pkg -czf dist/dlbronz-linux-x86_64.tar.gz dlbronz-linux
          ls -la dist

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-linux-x86_64
          path: dist/dlbronz-linux-x86_64.tar.gz

      - name: Upload sample screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-linux-sample-png
          path: dist/sample.png

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dlbronz-linux-x86_64.tar.gz
