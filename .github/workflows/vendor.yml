name: vendor
on: workflow_dispatch
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd rust/dlbronz_linux
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml
          tar -czf ../../dlbronz-vendor.tar.gz vendor Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: dlbronz-vendor
          path: dlbronz-vendor.tar.gz
