name: DLbronz
options:
  bundleIdPrefix: com.davidsigmaboy
  deploymentTarget:
    iOS: "16.0"
packages:
  DLbronzPackage:
    path: .
targets:
  DLbronz:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DLbronzPackage
        product: DLbronzEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DLbronz
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidsigmaboy.dlbronz
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
