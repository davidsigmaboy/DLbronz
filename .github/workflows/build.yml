import Foundation
import JavaScriptCore
import CRuntime
import CppRenderer
import Darwin

@main
struct DLbronzApp {
    static func main() async {
        print(String(cString: dlbronz_engine_version()))
        print("Independent experimental engine. No Chromium/WebKit/Gecko.")
        print("Commands: open <url> | js <code> | py <code> | quit")

        while true {
            print("\nDLbronz> ", terminator: "")
            guard let line = readLine() else { break }
            if line == "quit" || line == "exit" { break }

            if line.hasPrefix("js ") {
                runJavaScript(String(line.dropFirst(3)))
            } else if line.hasPrefix("py ") {
                runPython(String(line.dropFirst(3)))
            } else if line.hasPrefix("open ") {
                let raw = String(line.dropFirst(5)).trimmingCharacters(in: .whitespaces)
                await openPage(raw)
            } else {
                print("Unknown command.")
            }
        }
    }

    static func openPage(_ raw: String) async {
        let normalized = raw.hasPrefix("http://") || raw.hasPrefix("https://") ? raw : "https://" + raw
        guard dlbronz_is_http_url(normalized) == 1, let url = URL(string: normalized) else {
            print("Invalid URL")
            return
        }

        do {
            var request = URLRequest(url: url)
            request.setValue("DLbronz/0.1", forHTTPHeaderField: "User-Agent")
            let (data, response) = try await URLSession.shared.data(for: request)
            if let http = response as? HTTPURLResponse, !(200..<400).contains(http.statusCode) {
                print("HTTP status: \(http.statusCode)")
                return
            }
            let html = String(decoding: data, as: UTF8.self)
            let renderedPointer = html.withCString { dlbronz_render_html_text($0) }
            guard let renderedPointer else {
                print("Renderer allocation failed")
                return
            }
            defer { free(renderedPointer) }
            let visible = String(cString: renderedPointer)
            print("\n--- \(url.absoluteString) ---\n")
            print(visible.prefix(12000))
            print("\n[Prototype renderer: text extraction only; no CSS layout or image painting yet]")
        } catch {
            print("Load error: \(error.localizedDescription)")
        }
    }

    static func runJavaScript(_ source: String) {
        let context = JSContext()!
        context.exceptionHandler = { _, error in
            if let error { print("JavaScript error: \(error)") }
        }
        let result = context.evaluateScript(source)
        if let result, !result.isUndefined { print(result) }
    }

    static func runPython(_ source: String) {
        // macOS-only bridge: invokes the system Python 3 interpreter.
        // This is NOT available in an iOS app sandbox.
        let process = Process()
        process.executableURL = URL(fileURLWithPath: "/usr/bin/env")
        process.arguments = ["python3", "-c", source]
        let output = Pipe()
        process.standardOutput = output
        process.standardError = output
        do {
            try process.run()
            process.waitUntilExit()
            let data = output.fileHandleForReading.readDataToEndOfFile()
            print(String(decoding: data, as: UTF8.self))
            if process.terminationStatus != 0 {
                print("Python exited with status \(process.terminationStatus)")
            }
        } catch {
            print("Python 3 unavailable: \(error.localizedDescription)")
        }
    }
}


