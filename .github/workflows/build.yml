name: Build DLbronz

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Run tests / smoke check
        run: .build/release/DLbronz <<'EOF'
js 6 * 7
py print("Python runtime works")
quit
EOF

      - name: Package executable
        run: |
          mkdir -p dist
          cp .build/release/DLbronz dist/
          cp README.md dist/
          cd dist
          zip -r ../DLbronz-macos.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-macos
          path: DLbronz-macos.zip


