name: Build DLbronz IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchains
        run: |
          swift --version
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/dlbronz_web/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/dlbronz_web/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust core tests (no dependencies)
        run: ./scripts/test-core.sh

      - name: Build Rust xcframework (iOS, iOS simulator, macOS)
        run: ./scripts/build-rust-xcframework.sh

      - name: Engine tests (macOS)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project DLbronz.xcodeproj \
            -scheme DLbronz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/DLbronz.app"
          test -d "$APP"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/DLbronz.ipa Payload
          ls -la dist

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-ipa
          path: dist/DLbronz.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLbronz.ipa
