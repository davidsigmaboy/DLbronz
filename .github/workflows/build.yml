name: Build DLbronz

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (debug) and self-test
        run: |
          swift build
          .build/debug/DLbronz --selftest

      - name: Build app bundle (universal)
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-macos-zip
          path: dist/DLbronz-macos.zip

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: DLbronz-macos-dmg
          path: dist/DLbronz.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DLbronz-macos.zip
            dist/DLbronz.dmg
